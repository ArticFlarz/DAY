
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
        }

        header {
            background-color: #1e3a8a;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        footer {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 18px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my first website using HTML and CSS.</p>
        <button onclick="showMessage()">Get Started</button>
    </section>

    <section id="about" style="text-align:center; padding:20px;">
        <h2>About Us</h2>
        <p style="margin-top:10px;">
            We create simple and useful web experiences.
        </p>
    </section>

    <section id="contact" style="text-align:center; padding:30px;">
        <h2>Contact Us</h2>
        <p style="margin-top:10px;">Email: example@email.com</p>
    </section>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

    <script>
        function showMessage() {
            alert("Welcome! Your website is working successfully.");
        }
    </script>

</body>
</html>
